name: Prepare Semver-Safe Dependency Refresh

on:
  push:
    branches:
      - bli-motion-1.0-dev
    paths:
      - ".github/workflows/dependency-refresh.yml"

permissions:
  contents: write

jobs:
  refresh-lockfile:
    name: Refresh and commit safe dependency updates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: starter/package-lock.json

      - name: Apply semver-safe audit fixes
        run: npm audit fix --package-lock-only

      - name: Keep benchmark harness dependency graph identical
        run: cp package-lock.json ../benchmarks/harness/package-lock.json

      - name: Commit refreshed lockfiles
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          git -C .. config user.name "github-actions[bot]"
          git -C .. config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C .. add starter/package-lock.json benchmarks/harness/package-lock.json
          if git -C .. diff --cached --quiet; then
            echo "Dependency lockfiles are already current."
            exit 0
          fi
          git -C .. commit -m "fix: refresh vulnerable Remotion dependencies"
          git -C .. push origin "HEAD:${GITHUB_REF_NAME}"
