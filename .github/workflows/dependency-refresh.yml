name: Prepare Semver-Safe Dependency Refresh

on:
  push:
    branches:
      - bli-motion-1.0-dev
    paths:
      - ".github/workflows/dependency-refresh.yml"

permissions:
  contents: read

jobs:
  refresh-lockfile:
    name: Refresh starter dependency lockfile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: starter/package-lock.json

      - name: Run semver-safe audit fix
        run: npm audit fix --package-lock-only

      - name: Upload refreshed lockfile
        uses: actions/upload-artifact@v4
        with:
          name: bli-motion-refreshed-package-lock
          path: starter/package-lock.json
          if-no-files-found: error
