name: Validate Remotion Starter

on:
  push:
    branches:
      - bli-motion-1.0-dev
    paths:
      - "starter/**"
      - ".github/workflows/validate-starter.yml"
  pull_request:
    paths:
      - "starter/**"
      - ".github/workflows/validate-starter.yml"

permissions:
  contents: read

jobs:
  typecheck:
    name: TypeScript check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: starter/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check starter
        run: npm run typecheck

      - name: Discover Remotion compositions
        run: npx remotion compositions src/index.ts
