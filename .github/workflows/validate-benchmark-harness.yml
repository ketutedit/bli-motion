name: Validate Benchmark Harness

on:
  push:
    branches:
      - bli-motion-1.0-dev
    paths:
      - "benchmarks/harness/**"
      - ".github/workflows/validate-benchmark-harness.yml"
  pull_request:
    paths:
      - "benchmarks/harness/**"
      - ".github/workflows/validate-benchmark-harness.yml"

concurrency:
  group: validate-benchmark-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: TypeScript and Remotion discovery
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: benchmarks/harness
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: benchmarks/harness/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Capture npm audit report
        run: npm audit --json > /tmp/bli-motion-benchmark-audit.json || true

      - name: Upload npm audit report
        uses: actions/upload-artifact@v4
        with:
          name: bli-motion-benchmark-npm-audit
          path: /tmp/bli-motion-benchmark-audit.json
          if-no-files-found: error

      - name: Type-check harness
        run: npm run typecheck

      - name: Discover benchmark composition
        run: npx remotion compositions src/index.ts
